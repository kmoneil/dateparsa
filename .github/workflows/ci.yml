name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # go.mod pins a patch version, so a runner on an older 1.26 fetches the
  # toolchain the module asks for. Every job uses this one value.
  GO_VERSION: "1.26"

jobs:
  check:
    name: format, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Every tool below is installed at the version the Makefile declares.
      # A floating formatter or linter can fail a pull request that changed
      # nothing, and can fail a release, because this gate re-runs on a tag
      # that cannot be moved.
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@$(make -s print-GOFUMPT_VERSION)
          make fmt-check
      - name: vet
        run: make vet
      # The version comes from the Makefile like every other tool's, rather
      # than being written here as well. It was `version: v2.12.2` beside a
      # `GOLANGCI_LINT_VERSION := v2.12.2` in the Makefile: two places that
      # agreed, until the day somebody moved one.
      #
      # The action stays rather than going the way release.yml does it, which
      # is `go install`. That builds golangci-lint from source, which a release
      # can afford once and a pull-request gate should not pay on every run;
      # the action fetches a released binary and caches it.
      - name: golangci-lint version
        id: golangci
        run: echo "version=$(make -s print-GOLANGCI_LINT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Three operating systems and one Go version. The reason written here
        # used to be time.LoadLocation reading a zoneinfo database Windows
        # keeps elsewhere, and that call is gone: lookupTZAbbr is a closed
        # switch that touches no filesystem.
        #
        # Nothing specific replaces it. The whole non-test import set is time,
        # fmt, strings, sync, sort, math, errors, strconv, unicode, and the two
        # flextime needs, so the platform-dependent surface is small and the
        # matrix is cheap insurance rather than a defence against a known
        # divergence. Say that rather than leave a mechanism nobody can find:
        # the stale reason is what somebody would cite when deciding whether to
        # cut the matrix.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: test
        run: go test -race -count=1 -timeout=180s ./...

  alloc:
    name: zero-alloc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Its own job rather than a step in `test`, because it must run without
      # -race: testing.AllocsPerRun counts the allocations the race detector
      # itself makes, so the assertion is only meaningful in a build without
      # it. This is the single number the library exists to hold.
      - name: Layout.Parse allocates zero times
        run: make alloc

  vuln:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # There are no dependencies, so everything this can find is in the
      # standard library the module builds against. That is the reason to run
      # it, not a reason to skip it.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@$(make -s print-GOVULNCHECK_VERSION)
          make vuln

  size:
    name: size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Twenty locales of compiled data are most of the linked size, and every
      # downstream binary pays for them whether it uses the locale or not.
      - name: a binary importing this library stays under budget
        run: make size

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Informational and deliberately not a required check. A shared runner's
      # timings are too noisy to gate a merge on, and a flaky red teaches
      # people to press re-run. The numbers are here to be read in the log
      # when a change claims something about performance; benchstat against
      # benchmarks/baseline.txt on a real machine is what decides.
      - name: run the benchmarks
        run: go test -bench=. -benchmem -count=1 -timeout=600s | tee /tmp/bench.txt
      - name: the numbers that matter
        run: |
          echo "=== key results ==="
          grep -E 'BenchmarkLayout_Parse-|BenchmarkParse_ISO8601-|BenchmarkParser_Cached-' /tmp/bench.txt

  # The fuzz sweep does not run on a pull request.
  #
  # The regression half is already there, inside the `test` job: `go test`
  # executes every seed and every crasher ever committed under testdata/fuzz,
  # deterministically, with no fuzzing budget at all. That is what stops a
  # fixed bug from coming back, and it is the half worth blocking a merge on.
  #
  # What is left is discovery, and discovery scales with cumulative CPU time
  # against a corpus that persists, not with the length of any one run. A
  # 30-second run against a corpus last night already explored re-derives what
  # it derived then. It runs here after a merge, and properly in
  # fuzz-nightly.yml.
  fuzz:
    name: fuzz
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: locate the fuzz cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      # Go keeps the generated corpus in $GOCACHE/fuzz. Without this, every run
      # starts from the seeds alone and spends its whole budget re-deriving the
      # same shallow coverage. The key rotates per run so a run that finds new
      # inputs saves them; restore-keys falls back to the most recent corpus,
      # which is whatever the nightly left behind.
      - name: restore the fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: sweep every target
        run: make fuzz FUZZTIME=20s
      - name: upload any crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers
          path: "**/testdata/fuzz/"
          if-no-files-found: warn
