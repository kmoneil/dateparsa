name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run tests
        run: go test -race -count=1 -timeout=120s ./...
      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=1 -timeout=300s > /tmp/benchmarks.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: /tmp/benchmarks.txt
